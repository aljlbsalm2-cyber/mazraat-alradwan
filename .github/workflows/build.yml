name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o project.zip -d extracted_project || unzip -o *.zip -d extracted_project

    - name: Build Debug APK
      run: |
        cd extracted_project/* 2>/dev/null || cd extracted_project
        gradle assembleDebug || ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
